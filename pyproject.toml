[project]
name = "gridkeepup"
version = "0.1.0"
description = "Can the grid power the data center boom? An open hourly model of demand, supply and reliability for ERCOT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
gridkeepup = "gridkeepup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridkeepup"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
