# Every modelling assumption lives here, with its source or rationale.
# Values marked TODO are set together in the iteration where they first matter.

horizon:
  start_year: 2026
  end_year: 2030          # extend to 2033 (ERCOT's reporting horizon) later

region:
  name: ERCOT
  eia_respondent: ERCO    # EIA-930 balancing-authority code for ERCOT
  state: TX               # EIA-860M filter (ERCOT covers most, not all, of Texas)
  eia860m_balancing_authority: ERCO

history:
  first_year: 2019        # EIA-930 hourly data used as weather years
  last_year: 2025

demand:                   # v1: decided 2026-11-26, rationale in docs/demand-assumptions.md
  facility_to_it_power: 1.3   # Epoch AI: facility power is typically ~1.3x IT power

  # Stages = ERCOT Batch Zero classification (Sep 2026) plus already-connected load.
  # p_connect = share of the stage's MW whose project connects by the end of the horizon.
  # in_baseline = already on the system, so already inside EIA's historical demand
  #   (counting it again as "new" would double count).
  stages:
    # ERCOT: 5.9 GW of large loads energized (Apr 2026) but only ~3.9 GW observed drawing
    # at peak (Mar 2026). The drawing part is in the historical baseline; the rest is
    # already connected and still ramping, which the energization pause does not stop.
    - name: Energized, drawing (in baseline)
      gw: 3.9
      in_baseline: true
      p_connect: {low: 1.0, mid: 1.0, high: 1.0}
    - name: Energized, still ramping
      gw: 2.0                         # 5.9 energized - 3.9 drawing
      in_baseline: false
      p_connect: {low: 0.80, mid: 0.90, high: 1.00}
      connect_years: [2026]           # already connected; ramps from now
      ramp_years: 2                   # remaining ramp is shorter than a new campus's
    - name: Approved, not yet operational
      gw: 3.2
      in_baseline: false
      p_connect: {low: 0.50, mid: 0.75, high: 1.00}
      connect_years: [2027]           # already approved: first in line once the pause ends
    - name: Batch Zero base load
      gw: 66.4
      in_baseline: false
      p_connect: {low: 0.10, mid: 0.20, high: 0.40}
    - name: Batch Zero studied load
      gw: 127.9
      in_baseline: false
      p_connect: {low: 0.01, mid: 0.03, high: 0.08}
      connect_years: [2028, 2029, 2030]   # earlier stage: needs more study first
    - name: Excluded
      gw: 302.2
      in_baseline: false
      p_connect: {low: 0.0, mid: 0.0, high: 0.0}

  # Crypto mining is excluded from new demand: it curtails in tight hours, so it adds
  # little at peak. Queue stages are scaled by the data center share. Existing crypto is
  # already in the historical demand baseline. Set include_crypto: true to count it.
  include_crypto: false
  datacenter_share: 0.90      # ERCOT: ~90% of large-load requests are data centers (Jun 2026)

  first_new_connection_year: 2027   # energization pause since 3 Aug 2026; stages without
                                    # connect_years spread evenly from here to horizon end
  ramp_years: 3               # linear ramp to full load after connection
  load_factor: 0.70           # average draw / nameplate (energy)
  peak_factor: 0.90           # draw at system peak / nameplate (non-flexible data centers)

crosscheck:               # v1 bottom-up check against Epoch AI's frontier AI data centers
  epoch_since: "2026-08-01"   # count Epoch buildout from the start of the energization pause
  # Texas sites Epoch lists that may be outside ERCOT (Panhandle / South Plains utilities
  # can be in SPP). Excluded from the "likely ERCOT" total until their utility is checked.
  epoch_possibly_not_ercot:
    - Goodnight               # Claude, TX (Armstrong County, Panhandle)
    - Coreweave Helios        # Afton, TX (Dickens County)

supply:                   # v2: decided 2026-11-27 (rationale in docs/supply-assumptions.md;
                          # values computed from data are recomputed by `gridkeepup derive`)
  snapshot_year: 2026         # EIA-860M October 2026: the operating fleet is "today"
  completion_rate_source: "LBNL Queued Up 2026 (ERCOT projects, computed); EIA planned-vs-actual history"

  # Chance a planned unit reaches operation, by its EIA-860M status code.
  status_probability:
    TS: {low: 0.98, mid: 0.99, high: 1.00}   # construction complete, not yet in commercial operation
    V:  {low: 0.90, mid: 0.95, high: 1.00}   # under construction, more than 50% complete
    U:  {low: 0.80, mid: 0.90, high: 0.95}   # under construction, 50% complete or less
    T:  {low: 0.45, mid: 0.56, high: 0.70}   # regulatory approvals received, not under construction
                                             # (ERCOT post-agreement completion: 56%, LBNL)
    L:  {low: 0.30, mid: 0.40, high: 0.55}   # regulatory approvals pending, not under construction
    P:  {low: 0.15, mid: 0.24, high: 0.35}   # planned, regulatory approvals not initiated
                                             # (ERCOT requests reaching operation: 24%, LBNL)
    OT: {low: 0.25, mid: 0.40, high: 0.60}   # other

  # Years added to the developer's planned online year.
  status_delay_years:
    TS: {low: 0, mid: 0, high: 0}
    V:  {low: 1, mid: 0, high: 0}
    U:  {low: 1, mid: 0, high: 0}
    T:  {low: 1, mid: 1, high: 0}
    L:  {low: 2, mid: 1, high: 0}
    P:  {low: 2, mid: 1, high: 1}
    OT: {low: 2, mid: 1, high: 1}

  planned_storage_hours: 1.7  # derived: planned batteries have no MWh in EIA-860M, so they get
                              # today's ERCOT fleet average, 33,021 MWh / 19,605 MW nameplate = 1.7 h

  # ERCOT's interconnection queue (GIS report) for new projects from first_year on; EIA-860M
  # planned projects are used up to the year before. Avoids double counting: the two lists
  # name projects differently and cannot be merged reliably.
  ercot_gis:
    enabled: true
    first_year: 2028
    # Timing for queue projects with a signed agreement or in study: the chance a project is
    # online by year Y follows ERCOT's history (data/derived/completion_curves.csv, written by
    # `gridkeepup derive`): shape from the curve for years since signing / queue entry, level
    # from the eventual odds below, conditional on not being online yet at the snapshot, and
    # never before the project's projected online year. (Applying eventual odds at projected
    # dates instead added 44 GW in 2028, 3x ERCOT's record year.)
    timing: curves
    # Federal tax credits for wind and solar end for projects that start construction after
    # 4 Jul 2026 and enter service after 2027 (2025 budget law, "OBBBA"). History has no such
    # break, so queue wind/solar not yet under construction get their odds multiplied by a
    # bracket: low = none proceed, mid = half, high = all (as if history still applied).
    # Storage and gas keep their credits/economics, so they are not affected.
    tax_credit_factor:
      fuels: [Solar, Wind]
      stages: [signed, study]
      low: 0.0
      mid: 0.5
      high: 1.0
    stage_probability:
      synchronized: {low: 0.98, mid: 0.99, high: 1.00}   # as EIA status TS
      energized:    {low: 0.98, mid: 0.99, high: 1.00}   # as EIA status TS
      construction: {low: 0.80, mid: 0.90, high: 0.95}   # as EIA status U
      study:        # eventual odds, derived from all ERCOT requests 2000-2020 (LBNL), same rule
        Wind:    {low: 0.28, mid: 0.31, high: 0.34}
        Gas:     {low: 0.27, mid: 0.29, high: 0.32}
        Solar:   {low: 0.23, mid: 0.34, high: 0.46}
        Storage: {low: 0.13, mid: 0.39, high: 0.66}
        Other:   {low: 0.24, mid: 0.32, high: 0.39}
      signed:       # eventual odds, derived from ERCOT history (LBNL): low = operating, mid = +
                    # half still in progress, high = + all still in progress; Other = all-fuel rate
        Wind:    {low: 0.69, mid: 0.74, high: 0.80}
        Gas:     {low: 0.54, mid: 0.56, high: 0.57}
        Solar:   {low: 0.50, mid: 0.67, high: 0.83}
        Storage: {low: 0.42, mid: 0.66, high: 0.90}
        Other:   {low: 0.56, mid: 0.64, high: 0.73}
    stage_delay_years:      # only for stages not timed by the curves
      synchronized: {low: 0, mid: 0, high: 0}
      energized:    {low: 0, mid: 0, high: 0}
      construction: {low: 1, mid: 0, high: 0}
    summer_ratio:   # derived: ERCOT reports nameplate MW; net summer / nameplate of today's fleet
      Gas: 0.89
      Solar: 1.0
      Wind: 1.0
      Storage: 0.99
      Other: 1.0    # nuclear, hydro, other: too few queued projects to matter
  thermal_forced_outage_rate: null   # TODO v3

adequacy:                 # v3 (proposed 2026-11-27): hourly test, docs/adequacy-assumptions.md
  reference_year: 2026      # weather-year load is scaled to this year's level, then grown
  # Load: each weather year's hourly load x (1 + peak_growth)^(2026 - weather year). Derived:
  # ERCOT annual peak 2019 (EIA-930) to 2026 (record 91,134 MW).
  peak_growth_to_reference: 0.029
  # Growth of everything except new data centers from 2026, all hours. Mid derived: same
  # peaks with 2026 minus the 4,370 MW observed peak of approved large loads; low/high = mid
  # -/+ 1 point (judgment).
  non_datacenter_load_growth: {low: 0.012, mid: 0.022, high: 0.032}
  datacenter_profile: flat  # new data center load = v1 peak_gw in every hour
  uri_rebuild: true         # rebuild Uri load-shed hours: 14 Feb 2021 shape, scaled to
                            # ERCOT's 76,819 MW estimate of demand without load shed
  reserve_mw: 1500          # ERCOT sheds firm load (EEA3) to keep 1,500 MW of reserves
  storage_round_trip: 0.82  # EIA, US utility-scale battery fleet (2019)
  winter_months: [12, 1, 2] # net winter capacity in these months, net summer otherwise
  thermal_forced_outage_rate:   # NERC 2026 State of Reliability (2025 data) unless noted
    Natural Gas Fired Combined Cycle: 0.057
    Conventional Steam Coal: 0.141
    Petroleum Coke: 0.141
    Nuclear: 0.03           # judgment: no current NERC figure found; 5 GW, small effect
    default: 0.092          # all conventional generation (other gas, oil, biomass, new gas)
  new_thermal_unit_mw: 200  # planned thermal additions modelled as units of this size
  chp_counted_as: private_use_network   # CHP units (11.7 GW) replaced by ERCOT's PUN
                                        # net export: 3,194 MW summer / 4,283 MW winter
  winter_storms:            # extra thermal outages on top of normal forced outages
    uri:     {start: "2021-02-14 06:00", end: "2021-02-20 06:00", thermal_out_mw: 14000}
    elliott: {start: "2022-12-22 12:00", end: "2022-12-26 06:00", thermal_out_mw: 14000}
    heather: {start: "2024-01-14 06:00", end: "2024-01-18 06:00", thermal_out_mw: 7000}
    # Uri uses Elliott's level: generators winterized after 2021 (SB 3); ERCOT's own storm
    # scenario also starts from Elliott outages. Extra = thermal_out_mw - expected normal outage.
  # Resources the model does not see (DC tie imports, emergency demand response and load
  # resources, conservation, lower outages at peak than the annual average). Calibrated: the
  # MW that makes the model reproduce ERCOT's emergency record 2019-2023 (outside Uri): 3 days
  # with an Energy Emergency Alert (EEA1 twice in Aug 2019, EEA2 on 6 Sep 2023), EEA1 then
  # declared when reserves fell below 2,300 MW. Recomputed by `gridkeepup derive`.
  unmodeled_resources_mw: 5600
  calibration: {years: [2019, 2020, 2021, 2022, 2023], eea_days: 3, eea_reserve_mw: 2300}
  rare_events:              # weighted by their annual chance instead of 1 in N weather years
    uri: {start: "2021-02-14 06:00", end: "2021-02-20 06:00", annual_probability: 0.02}
    # Texas state climatologist: about a 1 in 50 chance each winter of a Uri-like storm
  copt_step_mw: 10
  charge_safe_quantile: 0.001   # batteries charge only if thermal at this low quantile covers it
  reliability_standard: 0.1     # LOLE, loss-of-load events per year (PUCT, 16 TAC 25.508)
